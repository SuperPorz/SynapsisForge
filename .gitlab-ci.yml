stages:
  - build
  - test
  - seed
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: michelangelostega/synapsisforge-backend
  FRONTEND_IMAGE: michelangelostega/synapsisforge-frontend
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

# ── BUILD ──────────────────────────────────────────────────────────────

backend-build:
  image: docker:27-cli
  services:
    - docker:27-dind
  stage: build
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t $BACKEND_IMAGE:$IMAGE_TAG -t $BACKEND_IMAGE:latest ./backend
    - docker push $BACKEND_IMAGE:$IMAGE_TAG
    - docker push $BACKEND_IMAGE:latest
  only:
    - main

frontend-build:
  image: docker:27-cli
  services:
    - docker:27-dind
  stage: build
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t $FRONTEND_IMAGE:$IMAGE_TAG -t $FRONTEND_IMAGE:latest ./frontend
    - docker push $FRONTEND_IMAGE:$IMAGE_TAG
    - docker push $FRONTEND_IMAGE:latest
  only:
    - main

# ── TEST ────────────────────────────────────────────────────────────────

backend-lint:
  image: node:22-alpine
  stage: test
  script:
    - cd backend
    - npm ci
    - npm run lint
  cache:
    key: $CI_COMMIT_REF_SLUG-backend
    paths:
      - backend/node_modules/

backend-unit-tests:
  image: node:22-alpine
  stage: test
  script:
    - cd backend
    - npm ci
    - npm test
  cache:
    key: $CI_COMMIT_REF_SLUG-backend
    paths:
      - backend/node_modules/

frontend-test:
  image: node:22-alpine
  stage: test
  script:
    - cd frontend
    - npm ci
    - npm test
  cache:
    key: $CI_COMMIT_REF_SLUG-frontend
    paths:
      - frontend/node_modules/

frontend-build-check:
  image: node:22-alpine
  stage: test
  script:
    - cd frontend
    - npm ci
    - npx ng build
  cache:
    key: $CI_COMMIT_REF_SLUG-frontend
    paths:
      - frontend/node_modules/

# ── SEED ────────────────────────────────────────────────────────────────

seed-ec2:
  image: alpine:latest
  stage: seed
  before_script:
    - apk add --no-cache openssh-client docker-cli docker-cli-compose
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      # Create .env.production locally (safe heredoc — no quoting issues)
      cat > .env.production << EOF
      NODE_ENV=production
      DB_HOST=postgres
      DB_PORT=${DB_PORT}
      DB_USERNAME=${DB_USERNAME}
      DB_PASSWORD=${DB_PASSWORD}
      DB_DATABASE=${DB_DATABASE}
      MONGO_URI=mongodb://mongodb:27017/mongo_synapsis
      MONGO_USER=${MONGO_USER}
      MONGO_PASS=${MONGO_PASS}
      MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE:-admin}
      REDIS_URL=redis://redis:6379
      JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      AWS_REGION=${AWS_REGION}
      AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      S3_MEDIA_BUCKET=${S3_MEDIA_BUCKET}
      S3_PRIVATE_BUCKET=${S3_PRIVATE_BUCKET}
      USE_S3=${USE_S3}
      BRAINTREE_MERCHANT_ID=${BRAINTREE_MERCHANT_ID}
      BRAINTREE_PUBLIC_KEY=${BRAINTREE_PUBLIC_KEY}
      BRAINTREE_PRIVATE_KEY=${BRAINTREE_PRIVATE_KEY}
      GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}
      SMTP_HOST=${SMTP_HOST}
      SMTP_PORT=${SMTP_PORT}
      SMTP_USER=${SMTP_USER}
      SMTP_PASS=${SMTP_PASS}
      SMTP_FROM=${SMTP_FROM}
      FRONTEND_URL=${FRONTEND_URL}
      CORS_ORIGIN=${CORS_ORIGIN}
      EOF

      # ── Create seed.sh locally ──
      cat > seed.sh << 'SCRIPT'
#!/bin/bash
set -e

echo '→ Resetting PostgreSQL volume to match CI credentials...'
cd ~/SynapsisForge
docker compose -f infra/docker-compose.prod.yml --env-file .env.production stop postgres 2>/dev/null || true
docker compose -f infra/docker-compose.prod.yml --env-file .env.production rm -f postgres 2>/dev/null || true
for vol in $(docker volume ls -q | grep -i pgdata); do
  docker volume rm "$vol" 2>/dev/null || true
done

echo '→ Starting PostgreSQL with fresh data...'
docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d postgres --wait

echo '→ Pulling latest backend image...'
docker pull michelangelostega/synapsisforge-backend:latest

echo '→ Syncing database schema (fresh postgres volume needs tables)...'
docker run --rm --network infra_default \
  --env-file ~/SynapsisForge/.env.production \
  michelangelostega/synapsisforge-backend:latest \
  node node_modules/.bin/typeorm schema:sync -d dist/data-source.js

echo '→ Running database seeds...'
docker run --rm --network infra_default \
  --env-file ~/SynapsisForge/.env.production \
  michelangelostega/synapsisforge-backend:latest \
  node dist/database/seeds/seed.js
echo '✅ Seed complete!'
SCRIPT

      # ── Copy both files to EC2 ──
      scp -i ~/.ssh/deploy_key .env.production $SSH_USER@$SSH_HOST:~/SynapsisForge/.env.production
      scp -i ~/.ssh/deploy_key seed.sh $SSH_USER@$SSH_HOST:~/SynapsisForge/seed.sh

      # ── Execute seed script on EC2 ──
      ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
        set -e
        bash ~/SynapsisForge/seed.sh
      "
  only:
    - main
  environment:
    name: production

# ── DEPLOY ──────────────────────────────────────────────────────────────

deploy-ec2:
  image: alpine:latest
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client docker-cli docker-cli-compose
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      # ── Create .env.production locally ──
      cat > .env.production << EOF
      NODE_ENV=production
      DB_HOST=postgres
      DB_PORT=${DB_PORT}
      DB_USERNAME=${DB_USERNAME}
      DB_PASSWORD=${DB_PASSWORD}
      DB_DATABASE=${DB_DATABASE}
      MONGO_URI=mongodb://mongodb:27017/mongo_synapsis
      MONGO_USER=${MONGO_USER}
      MONGO_PASS=${MONGO_PASS}
      MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE:-admin}
      REDIS_URL=redis://redis:6379
      JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      AWS_REGION=${AWS_REGION}
      AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      S3_MEDIA_BUCKET=${S3_MEDIA_BUCKET}
      S3_PRIVATE_BUCKET=${S3_PRIVATE_BUCKET}
      USE_S3=${USE_S3}
      BRAINTREE_MERCHANT_ID=${BRAINTREE_MERCHANT_ID}
      BRAINTREE_PUBLIC_KEY=${BRAINTREE_PUBLIC_KEY}
      BRAINTREE_PRIVATE_KEY=${BRAINTREE_PRIVATE_KEY}
      GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}
      SMTP_HOST=${SMTP_HOST}
      SMTP_PORT=${SMTP_PORT}
      SMTP_USER=${SMTP_USER}
      SMTP_PASS=${SMTP_PASS}
      SMTP_FROM=${SMTP_FROM}
      FRONTEND_URL=${FRONTEND_URL}
      CORS_ORIGIN=${CORS_ORIGIN}
      EOF

      # ── Create deploy.sh locally (unescaped $ = CI var on runner; escaped \$ = var on EC2) ──
      cat > deploy.sh << EOF
      #!/bin/bash
      set -e

      # CI variable values embedded at script-build time
      BACKEND_IMAGE=$BACKEND_IMAGE
      FRONTEND_IMAGE=$FRONTEND_IMAGE
      CI_JOB_TOKEN=$CI_JOB_TOKEN

      echo '→ Pulling latest images...'
      docker pull \${BACKEND_IMAGE}:latest
      docker pull \${FRONTEND_IMAGE}:latest

      echo '→ Ensuring infra directory exists...'
      mkdir -p ~/SynapsisForge/infra

      echo '→ Pulling latest code from GitLab...'
      cd ~/SynapsisForge
      git remote add gitlab https://gitlab-ci-token:\${CI_JOB_TOKEN}@gitlab.com/superporz1/SynapsisForge.git 2>/dev/null || git remote set-url gitlab https://gitlab-ci-token:\${CI_JOB_TOKEN}@gitlab.com/superporz1/SynapsisForge.git
      git fetch gitlab
      git reset --hard gitlab/main

      echo '→ Deploying with docker compose...'
      cd ~/SynapsisForge
      docker compose -f infra/docker-compose.prod.yml --env-file .env.production pull
      docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d --remove-orphans

      echo '→ Waiting for backend health...'
      for i in \$(seq 1 12); do
        if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
          echo '✅ Backend is healthy'
          break
        fi
        echo "   attempt \${i}/12..."
        sleep 5
      done
      curl -sf http://localhost:3000/health > /dev/null 2>&1 || {
        echo '❌ Backend failed to start within 60s'
        exit 1
      }

      echo '→ Cleaning up old images...'
      docker image prune -f

      echo '✅ Deploy complete!'
      EOF

      # ── Copy both files to EC2 ──
      scp -i ~/.ssh/deploy_key .env.production $SSH_USER@$SSH_HOST:~/SynapsisForge/.env.production
      scp -i ~/.ssh/deploy_key deploy.sh $SSH_USER@$SSH_HOST:~/SynapsisForge/deploy.sh

      # ── Execute deploy script on EC2 ──
      ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
        set -e
        bash ~/SynapsisForge/deploy.sh
      "
  only:
    - main
  environment:
    name: production
    url: https://synapsisforge.shop
