stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: michelangelostega/synapsisforge-backend
  FRONTEND_IMAGE: michelangelostega/synapsisforge-frontend
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

# ── BUILD ──────────────────────────────────────────────────────────────

backend-build:
  image: docker:27-cli
  services:
    - docker:27-dind
  stage: build
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t $BACKEND_IMAGE:$IMAGE_TAG -t $BACKEND_IMAGE:latest ./backend
    - docker push $BACKEND_IMAGE:$IMAGE_TAG
    - docker push $BACKEND_IMAGE:latest
  only:
    - main

frontend-build:
  image: docker:27-cli
  services:
    - docker:27-dind
  stage: build
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t $FRONTEND_IMAGE:$IMAGE_TAG -t $FRONTEND_IMAGE:latest ./frontend
    - docker push $FRONTEND_IMAGE:$IMAGE_TAG
    - docker push $FRONTEND_IMAGE:latest
  only:
    - main

# ── TEST ────────────────────────────────────────────────────────────────

backend-lint:
  image: node:22-alpine
  stage: test
  script:
    - cd backend
    - npm ci
    - npm run lint
  cache:
    key: $CI_COMMIT_REF_SLUG-backend
    paths:
      - backend/node_modules/

backend-unit-tests:
  image: node:22-alpine
  stage: test
  script:
    - cd backend
    - npm ci
    - npm test
  cache:
    key: $CI_COMMIT_REF_SLUG-backend
    paths:
      - backend/node_modules/

frontend-test:
  image: node:22-alpine
  stage: test
  script:
    - cd frontend
    - npm ci
    - npm test
  cache:
    key: $CI_COMMIT_REF_SLUG-frontend
    paths:
      - frontend/node_modules/

frontend-build-check:
  image: node:22-alpine
  stage: test
  script:
    - cd frontend
    - npm ci
    - npx ng build
  cache:
    key: $CI_COMMIT_REF_SLUG-frontend
    paths:
      - frontend/node_modules/

# ── DEPLOY ──────────────────────────────────────────────────────────────

deploy-ec2:
  image: alpine:latest
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client docker-cli docker-cli-compose
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - |
      ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
        set -e
        echo '→ Pulling latest images...'
        docker pull $BACKEND_IMAGE:latest
        docker pull $FRONTEND_IMAGE:latest

        echo '→ Ensuring infra directory exists...'
        mkdir -p ~/SynapsisForge/infra

        echo '→ Creating .env.production from CI variables...'
        echo \"NODE_ENV=production\" > ~/SynapsisForge/.env.production
        echo \"DB_HOST=$DB_HOST\" >> ~/SynapsisForge/.env.production
        echo \"DB_PORT=$DB_PORT\" >> ~/SynapsisForge/.env.production
        echo \"DB_USERNAME=$DB_USERNAME\" >> ~/SynapsisForge/.env.production
        echo \"DB_PASSWORD=$DB_PASSWORD\" >> ~/SynapsisForge/.env.production
        echo \"DB_DATABASE=$DB_DATABASE\" >> ~/SynapsisForge/.env.production
        echo \"MONGO_URI=$MONGO_URI\" >> ~/SynapsisForge/.env.production
        echo \"MONGO_USER=$MONGO_USER\" >> ~/SynapsisForge/.env.production
        echo \"MONGO_PASS=$MONGO_PASS\" >> ~/SynapsisForge/.env.production
        echo \"REDIS_URL=$REDIS_URL\" >> ~/SynapsisForge/.env.production
        echo \"JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET\" >> ~/SynapsisForge/.env.production
        echo \"JWT_ACCESS_EXPIRES_IN=$JWT_ACCESS_EXPIRES_IN\" >> ~/SynapsisForge/.env.production
        echo \"JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET\" >> ~/SynapsisForge/.env.production
        echo \"JWT_REFRESH_EXPIRES_IN=$JWT_REFRESH_EXPIRES_IN\" >> ~/SynapsisForge/.env.production
        echo \"AWS_REGION=$AWS_REGION\" >> ~/SynapsisForge/.env.production
        echo \"AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID\" >> ~/SynapsisForge/.env.production
        echo \"AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY\" >> ~/SynapsisForge/.env.production
        echo \"S3_MEDIA_BUCKET=$S3_MEDIA_BUCKET\" >> ~/SynapsisForge/.env.production
        echo \"S3_PRIVATE_BUCKET=$S3_PRIVATE_BUCKET\" >> ~/SynapsisForge/.env.production
        echo \"USE_S3=$USE_S3\" >> ~/SynapsisForge/.env.production
        echo \"BRAINTREE_MERCHANT_ID=$BRAINTREE_MERCHANT_ID\" >> ~/SynapsisForge/.env.production
        echo \"BRAINTREE_PUBLIC_KEY=$BRAINTREE_PUBLIC_KEY\" >> ~/SynapsisForge/.env.production
        echo \"BRAINTREE_PRIVATE_KEY=$BRAINTREE_PRIVATE_KEY\" >> ~/SynapsisForge/.env.production
        echo \"GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID\" >> ~/SynapsisForge/.env.production
        echo \"GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET\" >> ~/SynapsisForge/.env.production
        echo \"GOOGLE_CALLBACK_URL=$GOOGLE_CALLBACK_URL\" >> ~/SynapsisForge/.env.production
        echo \"GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID\" >> ~/SynapsisForge/.env.production
        echo \"GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET\" >> ~/SynapsisForge/.env.production
        echo \"GITHUB_CALLBACK_URL=$GITHUB_CALLBACK_URL\" >> ~/SynapsisForge/.env.production
        echo \"SMTP_HOST=$SMTP_HOST\" >> ~/SynapsisForge/.env.production
        echo \"SMTP_PORT=$SMTP_PORT\" >> ~/SynapsisForge/.env.production
        echo \"SMTP_USER=$SMTP_USER\" >> ~/SynapsisForge/.env.production
        echo \"SMTP_PASS=$SMTP_PASS\" >> ~/SynapsisForge/.env.production
        echo \"SMTP_FROM=$SMTP_FROM\" >> ~/SynapsisForge/.env.production
        echo \"FRONTEND_URL=$FRONTEND_URL\" >> ~/SynapsisForge/.env.production
        echo \"CORS_ORIGIN=$CORS_ORIGIN\" >> ~/SynapsisForge/.env.production

        echo '→ Pulling latest code from GitLab...'
        cd ~/SynapsisForge
        git fetch origin
        git reset --hard origin/main

        echo '→ Deploying with docker compose...'
        cd ~/SynapsisForge
        docker compose -f infra/docker-compose.prod.yml --env-file .env.production pull
        docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d --remove-orphans

        echo '→ Cleaning up old images...'
        docker image prune -f

        echo '✅ Deploy complete!'
      "
  only:
    - main
  when: always
  environment:
    name: production
    url: https://synapsisforge.shop
