# SynapsisForge Redis Configuration
# Phase 5 — Day 63: Redis metrics & monitoring

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence (RDB snapshots)
save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb
dir /data

# Networking
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Security
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""

# Keyspace events (for future Pub/Sub use)
notify-keyspace-events "Ex"

# Logging
loglevel notice
logfile ""
