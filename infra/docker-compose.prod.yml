services:
  seeder:
    image: michelangelostega/synapsisforge-backend:latest
    environment:
      NODE_ENV: production
      DB_USER: admin
      DB_PASS: qwerty
      DB_NAME: pg_database
      DB_HOST: postgres
      DB_PORT: 5432
      MONGO_URI: mongodb://admin:qwerty@mongodb:27017/mongo_synapsis?authSource=admin
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/database/seeds/seed.js"]
    restart: "no"

  backend:
    image: michelangelostega/synapsisforge-backend:latest
    # build:
    #   context: ../backend
    #   dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: admin
      DB_PASSWORD: qwerty
      DB_DATABASE: pg_database
      MONGO_URI: mongodb://admin:qwerty@mongodb:27017/mongo_synapsis?authSource=admin
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost
    env_file: ../backend/.env
    depends_on:
      postgres:
        condition: service_started
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    image: michelangelostega/synapsisforge-frontend:latest
    # build:
    #   context: ../frontend
    #   dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: pg_database
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pg_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: qwerty
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  mongo_data:
  redis_data:
  uploads_data:
