<app-navbar />
<main class="min-h-[calc(100vh-8rem)]">
  <router-outlet />
</main>
<app-footer />
<app-toast />

<button (click)="theme.toggle()" class="fixed bottom-6 left-6 z-50 flex h-7 w-14 cursor-pointer items-center rounded-full border border-gray-600 bg-gray-700 p-0.5 shadow-lg transition-colors dark:border-gray-400 dark:bg-gray-300" [attr.aria-label]="theme.isDark() ? 'Enable light mode' : 'Enable dark mode'">
  <span class="inline-flex h-5 w-5 items-center justify-center rounded-full bg-white shadow-sm transition-transform duration-200 dark:bg-gray-800" [class.translate-x-7]="theme.isDark()">
    @if (theme.isDark()) {
      <svg class="h-3.5 w-3.5 text-yellow-400" fill="currentColor" viewBox="0 0 24 24"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    } @else {
      <svg class="h-3.5 w-3.5 text-orange-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
    }
  </span>
</button>
