<section class="relative overflow-hidden bg-brand-navy px-6 pb-20 pt-16 sm:pb-28 sm:pt-24">
  <div class="mx-auto max-w-4xl text-center">
    <h1 class="text-4xl font-extrabold tracking-tight text-brand-white sm:text-5xl lg:text-6xl">
      Learn. Create. <span class="text-brand-orange">Grow.</span>
    </h1>
    <p class="mx-auto mt-6 max-w-2xl text-lg text-brand-white/60 sm:text-xl">
      Interactive courses with videos, quizzes, and certificates. Everything you need to take your skills to the next level.
    </p>
    <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">
      <a routerLink="/courses" class="rounded-xl bg-gradient-to-br from-brand-purple to-brand-orange px-8 py-3.5 text-base font-semibold text-white shadow-lg transition-all hover:opacity-90 hover:shadow-xl">
        Browse courses
      </a>
      @if (!auth.isAuthenticated()) {
        <a routerLink="/register" class="rounded-xl border border-brand-white/30 px-8 py-3.5 text-base font-semibold text-brand-white shadow-sm transition-all hover:bg-brand-white/10">
          Start free
        </a>
      }
      <a href="/api/docs/" target="_blank" class="rounded-xl border border-brand-white/30 bg-transparent px-8 py-3.5 text-base font-semibold text-brand-white/80 shadow-sm transition-all hover:bg-brand-white/5 hover:text-brand-white">
        API Docs
      </a>
    </div>
  </div>
</section>
