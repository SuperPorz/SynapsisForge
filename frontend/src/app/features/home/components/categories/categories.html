<div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="mb-10 text-center">
    <h2 class="text-3xl font-bold text-heading">Browse by category</h2>
    <p class="mt-2 text-fg-muted">Find the perfect course for you</p>
  </div>

  <div class="flex flex-wrap justify-center gap-3">
    @for (category of categories; track category.id) {
      <a [routerLink]="['/courses']" [queryParams]="{ category: category.slug }" class="rounded-full border border-brand-purple/30 bg-brand-purple/10 px-5 py-2 text-sm font-medium text-brand-purple transition-colors hover:bg-brand-purple hover:text-white">
        {{ category.label }}
      </a>
    }
  </div>
</div>
