<div>
    <h3>Categories</h3>
    <div>
        @for (category of categories; track category.id) {
            <a [routerLink]="['/catalog']" [queryParams]="{ category: category.slug }" class="bg-brand-softer border border-brand-subtle text-fg-brand-strong text-xs font-medium px-1.5 py-0.5 rounded-full">{{ category.label }}</a>
        }
    </div>
</div>
