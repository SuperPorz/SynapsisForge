<div class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="grid grid-cols-1 gap-6 sm:grid-cols-3">
    @for (stat of stats; track stat.id) {
      <div class="rounded-xl border border-gray-200 bg-card-bg p-8 text-center shadow-sm transition-shadow hover:shadow-md dark:border-gray-700 dark:bg-gray-800">
        <p class="mb-2 text-4xl font-bold text-fg-brand">{{ stat.value }}</p>
        <p class="text-fg-muted">{{ stat.label }}</p>
      </div>
    }
  </div>
</div>
