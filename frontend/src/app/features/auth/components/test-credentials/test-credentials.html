<div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
  <div class="mb-8 text-center">
    <h2 class="text-2xl font-bold text-heading">Don't want to register?</h2>
    <p class="mt-1 text-sm text-fg-muted">Use these credentials to LOGIN into the platform</p>
  </div>
  <div class="flex flex-col gap-4">
    @for (acc of accounts; track acc.email) {
      <div class="rounded-xl border border-gray-200 bg-card-bg p-5 shadow-sm transition-shadow hover:shadow-md dark:border-gray-700 dark:bg-gray-800">
        <div class="mb-3">
          <span class="inline-block rounded-full bg-fg-brand/10 px-3 py-0.5 text-xs font-semibold text-fg-brand">{{ acc.badge }}</span>
        </div>
        <p class="mb-1 text-sm font-medium text-heading">{{ acc.role }}</p>
        <p class="mb-0.5 font-mono text-xs text-fg-muted">{{ acc.email }}</p>
        <p class="mb-3 font-mono text-xs text-fg-muted">{{ acc.password }}</p>
        @if (showUseButton) {
          <button (click)="useAccount.emit(acc)" class="mt-2 w-full rounded-lg bg-fg-brand px-3 py-1.5 text-center text-xs font-semibold text-white transition-colors hover:bg-fg-brand-strong">
            Use this
          </button>
        }
      </div>
    }
  </div>
</div>
