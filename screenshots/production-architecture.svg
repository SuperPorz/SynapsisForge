<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SynapsisForge production architecture diagram">
  <rect width="1280" height="760" fill="#f8fafc"/>
  <rect x="40" y="40" width="1200" height="680" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="640" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Production Deployment</text>
  <text x="640" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">HTTPS traffic, reverse proxy, app services, and shared data infrastructure</text>

  <rect x="180" y="180" width="190" height="100" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="275" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#5b21b6">Client</text>
  <text x="275" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4c1d95">Web / Mobile</text>

  <rect x="440" y="180" width="190" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="535" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Cloudflare</text>
  <text x="535" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1e3a8a">DNS · TLS</text>

  <rect x="700" y="180" width="190" height="100" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="795" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">Nginx</text>
  <text x="795" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#14532d">Reverse Proxy</text>

  <line x1="370" y1="230" x2="440" y2="230" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="630" y1="230" x2="700" y2="230" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="300" y="360" width="180" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="390" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#92400e">Angular</text>
  <text x="390" y="428" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#78350f">Static front-end</text>

  <rect x="520" y="360" width="180" height="100" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="610" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#991b1b">NestJS</text>
  <text x="610" y="428" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7f1d1d">REST API</text>

  <rect x="740" y="360" width="180" height="100" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="830" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#075985">Background Jobs</text>
  <text x="830" y="428" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0c4a6e">BullMQ · Mailer</text>

  <line x1="795" y1="280" x2="390" y2="360" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="795" y1="280" x2="610" y2="360" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="795" y1="280" x2="830" y2="360" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="220" y="540" width="150" height="90" rx="16" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="295" y="575" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#7e22ce">PostgreSQL</text>
  <text x="295" y="600" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6b21a8">Relational data</text>

  <rect x="420" y="540" width="150" height="90" rx="16" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="495" y="575" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#be185d">MongoDB</text>
  <text x="495" y="600" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9d174d">Lessons · Quizzes</text>

  <rect x="620" y="540" width="150" height="90" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="695" y="575" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">Redis</text>
  <text x="695" y="600" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#115e59">Cache · Queue</text>

  <rect x="820" y="540" width="150" height="90" rx="16" fill="#fef2f2" stroke="#f43f5e" stroke-width="2"/>
  <text x="895" y="575" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#be123c">AWS S3</text>
  <text x="895" y="600" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9f1239">Media · Certificates</text>

  <line x1="610" y1="460" x2="295" y2="540" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <line x1="610" y1="460" x2="495" y2="540" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <line x1="610" y1="460" x2="695" y2="540" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <line x1="610" y1="460" x2="895" y2="540" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"/>

  <text x="640" y="680" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#334155">Deployed on EC2 with Docker Compose, Nginx, and SSL termination</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
